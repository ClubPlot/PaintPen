<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interplot · gamepad</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>interplot · gamepad</h1>
        <div class="row">
          <input id="url" type="text" spellcheck="false" />
          <button id="connect" type="button" class="primary">Connect</button>
          <button id="draw-track" type="button">Draw Track</button>
          <button id="start-race" type="button">Start Race</button>
          <span id="status" class="status idle">disconnected</span>
        </div>
      </header>

      <div id="stage">
        <iframe
          id="cam"
          src="https://plotpi.cymric-logarithm.ts.net:8889/cam/?controls=false&amp;muted=true"
          title="plotter camera"
          allow="autoplay"
        ></iframe>
        <canvas id="countdown" hidden></canvas>
        <pre id="hud"></pre>
      </div>

      <p id="pads">Press a button on a controller to connect it.</p>
      <pre id="state"></pre>

      <pre id="log"></pre>
    </div>
    <script type="module" src="/src/gamepad.ts"></script>
  </body>
</html>
